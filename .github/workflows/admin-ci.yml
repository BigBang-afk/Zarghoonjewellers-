name: Zarghoon AI dashboard

on:
  push:
    paths: ["admin/**", "core/**", ".github/workflows/admin-ci.yml"]
  pull_request:
    paths: ["admin/**", "core/**", ".github/workflows/admin-ci.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: admin

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            core/package-lock.json
            admin/package-lock.json
      - run: npm ci
        working-directory: core
      - run: npm ci
      - run: npm run build:core
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: End-to-end (demo mode, generated throwaway password)
        run: |
          export E2E_DEMO_PASSWORD="ci-$(openssl rand -hex 12)-1"
          npx playwright test
