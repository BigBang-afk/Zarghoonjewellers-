name: CI

# Phase 4 §33 — build/test/lint/migration-checks on every push and PR.
# No deploy job here on purpose: this workflow's only job is to tell you
# whether a change is safe to ship, never to ship it. A deploy pipeline
# is a separate, explicit-approval workflow to be added later.
on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  backend:
    name: Backend — typecheck, migration check, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit

      - name: Migration drift check
        # Fails if the committed migration history under prisma/migrations
        # doesn't produce the exact schema in schema.prisma — catches a
        # schema edit that was never turned into a migration.
        run: npx prisma migrate diff --from-migrations ./prisma/migrations --to-schema-datamodel ./prisma/schema.prisma --exit-code --shadow-database-url "file:./ci-shadow.db"

      - name: Run tests
        run: npm test

  frontend:
    name: Frontend — lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck + build
        run: npm run build
