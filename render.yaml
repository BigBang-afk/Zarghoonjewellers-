services:
  - type: web
    name: rivo-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build && npx prisma generate && npx prisma migrate deploy && npm run seed
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Forces npm to install devDependencies (tsc, @types/*, vitest, ...)
      # during the build step even with NODE_ENV=production set — the
      # --include=dev build-command flag alone wasn't enough, likely
      # because Render's node_modules build cache had already been
      # populated without them by the first, pre-fix failed deploy.
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: PAYMENTS_PROVIDER_WEBHOOK_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: MOCK_OTP
        value: "true"
      - key: MOCK_PAYMENTS
        value: "true"
      - key: MOCK_NOTIFICATIONS
        value: "true"
